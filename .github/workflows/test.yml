name: Look Up

on:
  pull_request:
    branches:
      - main

jobs: 
  test:
    runs-on: ubuntu-latest
    container:
      image: node:22
    steps:
      - uses: actions/checkout@v4
        with: 
          node-version: 22
      - run: npm ci

      - name: Run Linter
        run: npm run lint

      - run: npm run build